<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1">
        <animate attributeName="stop-color" values="#ff6b6b;#4ecdc4;#45b7d1;#ff6b6b" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#4ecdc4;stop-opacity:1">
        <animate attributeName="stop-color" values="#4ecdc4;#45b7d1;#ff6b6b;#4ecdc4" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#45b7d1;stop-opacity:1">
        <animate attributeName="stop-color" values="#45b7d1;#ff6b6b;#4ecdc4;#45b7d1" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <filter id="wave3d">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="6" dy="6" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.6"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="200" fill="#1a1a2e"/>
  
  <!-- 3D Wave text - Each letter animated individually -->
  <g transform="translate(400, 100)">
    <!-- Shadow layer -->
    <text font-family="'Arial Black', sans-serif" font-size="80" font-weight="bold" text-anchor="middle" fill="#000000" opacity="0.4">
      <tspan x="-140" y="8">👋</tspan>
      <tspan x="-60" y="8">H</tspan>
      <tspan x="-20" y="8">e</tspan>
      <tspan x="20" y="8">l</tspan>
      <tspan x="45" y="8">l</tspan>
      <tspan x="70" y="8">o</tspan>
      <tspan x="120" y="8">!</tspan>
    </text>
    
    <!-- Main text with wave animation -->
    <text font-family="'Arial Black', sans-serif" font-size="80" font-weight="bold" text-anchor="middle" fill="url(#rainbow)" filter="url(#wave3d)">
      <tspan x="-140" y="0">
        👋
        <animate attributeName="y" values="0;-15;0;15;0" dur="2s" repeatCount="indefinite"/>
      </tspan>
      <tspan x="-60" y="0">
        H
        <animate attributeName="y" values="0;-15;0;15;0" dur="2s" begin="0.1s" repeatCount="indefinite"/>
      </tspan>
      <tspan x="-20" y="0">
        e
        <animate attributeName="y" values="0;-15;0;15;0" dur="2s" begin="0.2s" repeatCount="indefinite"/>
      </tspan>
      <tspan x="20" y="0">
        l
        <animate attributeName="y" values="0;-15;0;15;0" dur="2s" begin="0.3s" repeatCount="indefinite"/>
      </tspan>
      <tspan x="45" y="0">
        l
        <animate attributeName="y" values="0;-15;0;15;0" dur="2s" begin="0.4s" repeatCount="indefinite"/>
      </tspan>
      <tspan x="70" y="0">
        o
        <animate attributeName="y" values="0;-15;0;15;0" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      </tspan>
      <tspan x="120" y="0">
        !
        <animate attributeName="y" values="0;-15;0;15;0" dur="2s" begin="0.6s" repeatCount="indefinite"/>
      </tspan>
    </text>
  </g>
  
  <!-- Subtitle -->
  <g transform="translate(400, 160)">
    <text x="2" y="2" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#000000" opacity="0.4">
      Welcome to my GitHub Profile
    </text>
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#e94560">
      Welcome to my GitHub Profile
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>