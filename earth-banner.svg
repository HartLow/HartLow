<svg width="1200" height="400" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Space gradient -->
    <radialGradient id="spaceGrad">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#020810;stop-opacity:1"/>
    </radialGradient>
    
    <!-- Earth gradient -->
    <radialGradient id="earthGrad" cx="35%" cy="35%">
      <stop offset="0%" style="stop-color:#87ceeb;stop-opacity:1"/>
      <stop offset="30%" style="stop-color:#4a90e2;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#2e7d32;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1565c0;stop-opacity:1"/>
    </radialGradient>
    
    <!-- Earth atmosphere glow -->
    <radialGradient id="atmosphereGlow">
      <stop offset="0%" style="stop-color:#64b5f6;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#64b5f6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#1976d2;stop-opacity:0.8"/>
    </radialGradient>
    
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Text gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#64b5f6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1"/>
    </linearGradient>
  </defs>
  
  <!-- Deep space background -->
  <rect width="1200" height="400" fill="url(#spaceGrad)"/>
  
  <!-- Stars field (nhiều sao nhấp nháy) -->
  <g id="stars">
    <circle cx="100" cy="50" r="1.5" fill="#ffffff"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="80" r="1" fill="#ffffff"><animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="120" r="1.5" fill="#ffffff"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="60" r="1" fill="#ffffff"><animate attributeName="opacity" values="0.6;1;0.6" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="100" r="1.5" fill="#ffffff"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="140" r="1" fill="#ffffff"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="70" r="1.5" fill="#ffffff"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="580" cy="110" r="1" fill="#ffffff"><animate attributeName="opacity" values="0.6;1;0.6" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="150" r="1.5" fill="#ffffff"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="90" r="1" fill="#ffffff"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="130" r="1.5" fill="#ffffff"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="60" r="1" fill="#ffffff"><animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="100" r="1.5" fill="#ffffff"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="140" r="1" fill="#ffffff"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.3s" repeatCount="indefinite"/></circle>
    
    <!-- More stars -->
    <circle cx="120" cy="200" r="1" fill="#ffffff"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="240" r="1.5" fill="#ffffff"><animate attributeName="opacity" values="0.6;1;0.6" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="280" r="1" fill="#ffffff"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="250" r="1.5" fill="#ffffff"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="550" cy="220" r="1" fill="#ffffff"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="260" r="1.5" fill="#ffffff"><animate attributeName="opacity" values="0.6;1;0.6" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="290" r="1" fill="#ffffff"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="230" r="1.5" fill="#ffffff"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="270" r="1" fill="#ffffff"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="240" r="1.5" fill="#ffffff"><animate attributeName="opacity" values="0.6;1;0.6" dur="2.7s" repeatCount="indefinite"/></circle>
  </g>
  
  <!-- Shooting stars (sao băng) -->
  <g id="shootingStars">
    <!-- Shooting star 1 -->
    <g opacity="0">
      <line x1="100" y1="80" x2="200" y2="150" stroke="url(#textGrad)" stroke-width="2" stroke-linecap="round"/>
      <circle cx="200" cy="150" r="3" fill="#ffffff" filter="url(#glow)"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;300,200" dur="3s" repeatCount="indefinite"/>
    </g>
    
    <!-- Shooting star 2 -->
    <g opacity="0">
      <line x1="500" y1="50" x2="600" y2="120" stroke="url(#textGrad)" stroke-width="2" stroke-linecap="round"/>
      <circle cx="600" cy="120" r="3" fill="#ffffff" filter="url(#glow)"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="4s" begin="1.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;400,250" dur="4s" begin="1.5s" repeatCount="indefinite"/>
    </g>
    
    <!-- Shooting star 3 -->
    <g opacity="0">
      <line x1="900" y1="100" x2="1000" y2="170" stroke="url(#textGrad)" stroke-width="2" stroke-linecap="round"/>
      <circle cx="1000" cy="170" r="3" fill="#ffffff" filter="url(#glow)"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="3.5s" begin="3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;350,220" dur="3.5s" begin="3s" repeatCount="indefinite"/>
    </g>
  </g>
  
  <!-- 3D Rotating Earth -->
  <g transform="translate(900, 200)">
    <!-- Atmosphere glow -->
    <circle cx="0" cy="0" r="110" fill="url(#atmosphereGlow)" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.8;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Earth body -->
    <circle cx="0" cy="0" r="90" fill="url(#earthGrad)" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Continents (simplified) -->
    <g opacity="0.8">
      <ellipse cx="-20" cy="-30" rx="25" ry="20" fill="#2e7d32" transform="rotate(-15)">
        <animateTransform attributeName="transform" type="rotate" from="-15" to="345" dur="20s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="30" cy="10" rx="30" ry="25" fill="#2e7d32" transform="rotate(10)">
        <animateTransform attributeName="transform" type="rotate" from="10" to="370" dur="20s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="-40" cy="40" rx="20" ry="15" fill="#2e7d32" transform="rotate(-20)">
        <animateTransform attributeName="transform" type="rotate" from="-20" to="340" dur="20s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    
    <!-- Clouds -->
    <g opacity="0.4">
      <ellipse cx="20" cy="-40" rx="15" ry="8" fill="#ffffff">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="25s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="-35" cy="20" rx="18" ry="10" fill="#ffffff">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="25s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    
    <!-- Earth shine -->
    <ellipse cx="-25" cy="-25" rx="30" ry="35" fill="#ffffff" opacity="0.15" transform="rotate(-30)"/>
  </g>
  
  <!-- Main text -->
  <g transform="translate(300, 180)">
    <text x="0" y="0" font-family="'Arial Black', sans-serif" font-size="64" font-weight="bold" fill="url(#textGrad)" filter="url(#glow)">
      Hello Everyone!!!
      <animate attributeName="opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite"/>
    </text>
  </g>
  
  <!-- Subtitle with tech icons -->
  <g transform="translate(300, 240)">
    <text x="0" y="0" font-family="'Arial', sans-serif" font-size="36" font-weight="bold" fill="#ffffff">
      I'm HartLow ❤️
    </text>
  </g>
  
  <!-- Tech stack icons area -->
  <g transform="translate(300, 300)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="24" fill="#64b5f6">
      💻 JavaScript | ⚛️ React | 🐍 Python | 🚀 Node.js
    </text>
  </g>
</svg>