<svg width="1200" height="350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="galaxyGrad">
      <stop offset="0%" style="stop-color:#ff0080;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#7928ca;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0a0e27;stop-opacity:1"/>
    </radialGradient>
    
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f5ff;stop-opacity:1">
        <animate attributeName="stop-color" values="#00f5ff;#fc00ff;#00ff9f;#00f5ff" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#fc00ff;stop-opacity:1">
        <animate attributeName="stop-color" values="#fc00ff;#00ff9f;#00f5ff;#fc00ff" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <filter id="megaGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Galaxy background -->
  <rect width="1200" height="350" fill="#0a0e27"/>
  
  <!-- Spiral galaxy -->
  <g transform="translate(950, 175)">
    <circle cx="0" cy="0" r="120" fill="url(#galaxyGrad)" opacity="0.3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Galaxy arms -->
    <g opacity="0.6">
      <path d="M0,0 Q50,-80 100,-100" stroke="url(#neonGrad)" stroke-width="3" fill="none" opacity="0.8">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
      </path>
      <path d="M0,0 Q-50,80 -100,100" stroke="url(#neonGrad)" stroke-width="3" fill="none" opacity="0.8">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
      </path>
      <path d="M0,0 Q80,50 100,100" stroke="url(#neonGrad)" stroke-width="3" fill="none" opacity="0.8">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
      </path>
      <path d="M0,0 Q-80,-50 -100,-100" stroke="url(#neonGrad)" stroke-width="3" fill="none" opacity="0.8">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
      </path>
    </g>
    
    <!-- Galaxy core -->
    <circle cx="0" cy="0" r="25" fill="url(#neonGrad)" filter="url(#megaGlow)">
      <animate attributeName="r" values="25;30;25" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Particles around galaxy -->
  <g>
    <circle cx="850" cy="100" r="3" fill="url(#neonGrad)">
      <animateTransform attributeName="transform" type="rotate" from="0 950 175" to="360 950 175" dur="15s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="250" r="3" fill="url(#neonGrad)">
      <animateTransform attributeName="transform" type="rotate" from="0 950 175" to="360 950 175" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="180" r="2" fill="url(#neonGrad)">
      <animateTransform attributeName="transform" type="rotate" from="0 950 175" to="360 950 175" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="160" r="2" fill="url(#neonGrad)">
      <animateTransform attributeName="transform" type="rotate" from="0 950 175" to="360 950 175" dur="22s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Text with extreme glow -->
  <g transform="translate(100, 150)">
    <text x="0" y="0" font-family="'Arial Black', sans-serif" font-size="72" font-weight="bold" fill="url(#neonGrad)" filter="url(#megaGlow)">
      HartLow
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite"/>
    </text>
  </g>
  
  <g transform="translate(100, 210)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="32" fill="#ffffff">
      🚀 Full-Stack Developer
    </text>
  </g>
  
  <g transform="translate(100, 260)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="24" fill="url(#neonGrad)">
      Building the future, one commit at a time
    </text>
  </g>
</svg>