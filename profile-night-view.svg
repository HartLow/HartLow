<svg width="1200" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nightSky3d" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000428;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#004e92;stop-opacity:1"/>
    </linearGradient>
    
    <radialGradient id="moon3d" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#fff9c4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ffa726;stop-opacity:0.3"/>
    </radialGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Sky -->
  <rect width="1200" height="400" fill="url(#nightSky3d)"/>
  
  <!-- Twinkling stars with depth -->
  <g id="stars">
    <circle cx="100" cy="60" r="2" fill="#ffffff" opacity="0.6">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="100" r="1.5" fill="#ffffff" opacity="0.5">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="70" r="2" fill="#ffffff" opacity="0.7">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="90" r="1.5" fill="#ffffff" opacity="0.6">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="50" r="2" fill="#ffffff" opacity="0.8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1100" cy="80" r="1.5" fill="#ffffff" opacity="0.5">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- 3D Moon with rotation -->
  <g transform="translate(950, 100)">
    <circle cx="0" cy="0" r="70" fill="url(#moon3d)" filter="url(#glow)">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="6s" repeatCount="indefinite"/>
    </circle>
    <!-- Moon craters -->
    <circle cx="-10" cy="-8" r="8" fill="#ffa726" opacity="0.3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
    </circle>
    <circle cx="12" cy="10" r="6" fill="#ffa726" opacity="0.2">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- 3D Mountains with parallax (3 layers) -->
  <path d="M0,350 L200,280 L400,320 L600,260 L800,300 L1000,270 L1200,310 L1200,400 L0,400 Z" 
        fill="#0d1b2a" opacity="0.4">
    <animate attributeName="d" 
             values="M0,350 L200,280 L400,320 L600,260 L800,300 L1000,270 L1200,310 L1200,400 L0,400 Z;
                     M0,360 L200,290 L400,330 L600,270 L800,310 L1000,280 L1200,320 L1200,400 L0,400 Z;
                     M0,350 L200,280 L400,320 L600,260 L800,300 L1000,270 L1200,310 L1200,400 L0,400 Z"
             dur="15s" repeatCount="indefinite"/>
  </path>
  
  <path d="M0,370 L150,310 L350,350 L550,300 L750,340 L950,310 L1200,350 L1200,400 L0,400 Z" 
        fill="#1b263b" opacity="0.6">
    <animate attributeName="d" 
             values="M0,370 L150,310 L350,350 L550,300 L750,340 L950,310 L1200,350 L1200,400 L0,400 Z;
                     M0,375 L150,315 L350,355 L550,305 L750,345 L950,315 L1200,355 L1200,400 L0,400 Z;
                     M0,370 L150,310 L350,350 L550,300 L750,340 L950,310 L1200,350 L1200,400 L0,400 Z"
             dur="12s" repeatCount="indefinite"/>
  </path>
  
  <path d="M0,380 L100,330 L300,370 L500,320 L700,360 L900,330 L1200,370 L1200,400 L0,400 Z" 
        fill="#2d3e50" opacity="0.8">
    <animate attributeName="d" 
             values="M0,380 L100,330 L300,370 L500,320 L700,360 L900,330 L1200,370 L1200,400 L0,400 Z;
                     M0,385 L100,335 L300,375 L500,325 L700,365 L900,335 L1200,375 L1200,400 L0,400 Z;
                     M0,380 L100,330 L300,370 L500,320 L700,360 L900,330 L1200,370 L1200,400 L0,400 Z"
             dur="10s" repeatCount="indefinite"/>
  </path>
  
  <!-- 3D Text with camera rotation -->
  <g transform="translate(600, 200)">
    <text x="10" y="10" font-family="'Arial Black', sans-serif" font-size="72" font-weight="bold" 
          text-anchor="middle" fill="#000000" opacity="0.5">
      HartLow
      <animateTransform attributeName="transform" type="skewX" values="0;-2;0;2;0" dur="10s" repeatCount="indefinite"/>
    </text>
    
    <text x="0" y="0" font-family="'Arial Black', sans-serif" font-size="72" font-weight="bold" 
          text-anchor="middle" fill="#ffffff" filter="url(#glow)">
      HartLow
      <animateTransform attributeName="transform" type="scale" values="1,1;1.02,1.02;1,1" dur="4s" repeatCount="indefinite"/>
    </text>
  </g>
  
  <!-- Subtitle -->
  <text x="600" y="270" font-family="Arial, sans-serif" font-size="24" 
        text-anchor="middle" fill="#64b5f6">
    ✨ Coding under the stars ✨
    <animate attributeName="fill" values="#64b5f6;#81c784;#ffb74d;#64b5f6" dur="8s" repeatCount="indefinite"/>
  </text>
</svg>