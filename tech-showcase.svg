<svg width="1000" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="techBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1"/>
    </linearGradient>
    
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffd89b;stop-opacity:1">
        <animate attributeName="stop-color" values="#ffd89b;#19547b;#ffd89b" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#19547b;stop-opacity:1">
        <animate attributeName="stop-color" values="#19547b;#ffd89b;#19547b" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <filter id="techGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="1000" height="300" fill="url(#techBg)"/>
  
  <!-- Floating tech icons (simplified) -->
  <g id="techIcons">
    <!-- JavaScript icon -->
    <g transform="translate(150, 150)">
      <rect x="-30" y="-30" width="60" height="60" rx="10" fill="#f7df1e" opacity="0.9">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-30;-40;-30" dur="3s" repeatCount="indefinite"/>
      </rect>
      <text x="0" y="10" font-family="Arial Black" font-size="36" font-weight="bold" text-anchor="middle" fill="#000000">JS</text>
    </g>
    
    <!-- React icon -->
    <g transform="translate(300, 100)">
      <circle cx="0" cy="0" r="35" fill="#61dafb" opacity="0.9">
        <animate attributeName="cy" values="0;-10;0" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <ellipse cx="0" cy="0" rx="50" ry="20" fill="none" stroke="#61dafb" stroke-width="3">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="0" cy="0" rx="50" ry="20" fill="none" stroke="#61dafb" stroke-width="3">
        <animateTransform attributeName="transform" type="rotate" from="60" to="420" dur="6s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="0" cy="0" rx="50" ry="20" fill="none" stroke="#61dafb" stroke-width="3">
        <animateTransform attributeName="transform" type="rotate" from="120" to="480" dur="6s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    
    <!-- Python icon -->
    <g transform="translate(500, 180)">
      <rect x="-30" y="-30" width="60" height="60" rx="10" fill="#3776ab" opacity="0.9">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-30;-40;-30" dur="4s" repeatCount="indefinite"/>
      </rect>
      <text x="0" y="10" font-family="Arial Black" font-size="36" font-weight="bold" text-anchor="middle" fill="#ffffff">Py</text>
    </g>
    
    <!-- Node.js icon -->
    <g transform="translate(700, 120)">
      <polygon points="0,-35 30,0 0,35 -30,0" fill="#339933" opacity="0.9">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="points" values="0,-35 30,0 0,35 -30,0;0,-40 35,0 0,40 -35,0;0,-35 30,0 0,35 -30,0" dur="3s" repeatCount="indefinite"/>
      </polygon>
    </g>
    
    <!-- AI/Bot icon -->
    <g transform="translate(850, 160)">
      <circle cx="0" cy="0" r="35" fill="#ff6b6b" opacity="0.9">
        <animate attributeName="cy" values="0;-10;0" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="12" font-family="Arial Black" font-size="32" text-anchor="middle" fill="#ffffff">🤖</text>
    </g>
  </g>
  
  <!-- Main text -->
  <text x="500" y="260" font-family="'Arial Black', sans-serif" font-size="42" font-weight="bold" text-anchor="middle" fill="url(#techGrad)" filter="url(#techGlow)">
    Tech Stack Showcase
  </text>
</svg>