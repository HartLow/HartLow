<svg width="1000" height="250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f5ff;stop-opacity:1">
        <animate attributeName="stop-color" values="#00f5ff;#fc00ff;#00ff9f;#00f5ff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#fc00ff;stop-opacity:1">
        <animate attributeName="stop-color" values="#fc00ff;#00ff9f;#00f5ff;#fc00ff" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <filter id="glow3d">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="shadow3d">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="8" dy="8" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.7"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Cyber background -->
  <rect width="1000" height="250" fill="#0a0e27"/>
  
  <!-- 3D Grid with perspective -->
  <g opacity="0.2" stroke="url(#cyber)" stroke-width="1">
    <line x1="0" y1="180" x2="1000" y2="180"/>
    <line x1="0" y1="200" x2="1000" y2="200"/>
    <line x1="0" y1="220" x2="1000" y2="220"/>
    
    <line x1="100" y1="180" x2="50" y2="250"/>
    <line x1="300" y1="180" x2="250" y2="250"/>
    <line x1="500" y1="180" x2="450" y2="250"/>
    <line x1="700" y1="180" x2="650" y2="250"/>
    <line x1="900" y1="180" x2="850" y2="250"/>
  </g>
  
  <!-- Rotating 3D shapes -->
  <g transform="translate(100, 80)">
    <polygon points="30,0 60,20 50,50 10,50 0,20" fill="none" stroke="url(#cyber)" stroke-width="2" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0 30 25" to="360 30 25" dur="8s" repeatCount="indefinite"/>
    </polygon>
  </g>
  
  <g transform="translate(900, 100)">
    <polygon points="0,0 40,15 40,45 0,60 -40,45 -40,15" fill="none" stroke="url(#cyber)" stroke-width="2" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="360 0 30" to="0 0 30" dur="10s" repeatCount="indefinite"/>
    </polygon>
  </g>
  
  <!-- Main text with 3D layers and rotation -->
  <g transform="translate(500, 100)">
    <!-- Deep shadow -->
    <text x="12" y="12" font-family="'Arial Black', sans-serif" font-size="56" font-weight="bold" 
          text-anchor="middle" fill="#000000" opacity="0.6">
      Hi, I'm HartLow! 👋
      <animateTransform attributeName="transform" type="skewX" values="0;-3;0;3;0" dur="10s" repeatCount="indefinite"/>
    </text>
    
    <!-- Mid layer -->
    <text x="6" y="6" font-family="'Arial Black', sans-serif" font-size="56" font-weight="bold" 
          text-anchor="middle" fill="#1a1a2e" opacity="0.7">
      Hi, I'm HartLow! 👋
      <animateTransform attributeName="transform" type="skewY" values="0;2;0;-2;0" dur="10s" repeatCount="indefinite"/>
    </text>
    
    <!-- Main text -->
    <text x="0" y="0" font-family="'Arial Black', sans-serif" font-size="56" font-weight="bold" 
          text-anchor="middle" fill="url(#cyber)" filter="url(#shadow3d)">
      Hi, I'm HartLow! 👋
      <animateTransform attributeName="transform" type="scale" values="1,1;1.03,1.03;1,1" dur="3s" repeatCount="indefinite"/>
    </text>
    
    <!-- Highlight -->
    <text x="-2" y="-2" font-family="'Arial Black', sans-serif" font-size="56" font-weight="bold" 
          text-anchor="middle" fill="#ffffff" opacity="0.4" filter="url(#glow3d)">
      Hi, I'm HartLow! 👋
    </text>
  </g>
  
  <!-- Animated subtitle -->
  <g transform="translate(500, 160)">
    <text x="2" y="2" font-family="Arial, sans-serif" font-size="24" 
          text-anchor="middle" fill="#000000" opacity="0.5">
      🚀 Building the future with code
    </text>
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="24" 
          text-anchor="middle" fill="url(#cyber)">
      🚀 Building the future with code
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </text>
  </g>
  
  <!-- Scan line effect -->
  <rect x="0" y="0" width="1000" height="3" fill="url(#cyber)" opacity="0.5" filter="url(#glow3d)">
    <animate attributeName="y" values="0;250;0" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Floating particles -->
  <circle cx="200" cy="60" r="4" fill="url(#cyber)" filter="url(#glow3d)">
    <animate attributeName="cy" values="60;200;60" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4;7;4" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="180" r="5" fill="url(#cyber)" filter="url(#glow3d)">
    <animate attributeName="cy" values="180;80;180" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="5;8;5" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>